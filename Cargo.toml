[workspace]
resolver = "2"
members = [
    "crates/crypto-wallet",
    "crates/domain_model",
    "crates/services",
    "crates/adapters",
    "crates/error",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0.0"

# Cryptography
sha2 = "0.10"
hex = "0.4"

# Error Handling
thiserror = "2.0.16"

# Async traits
async-trait = "0.1"

# Concurrency
parking_lot = "0.12"